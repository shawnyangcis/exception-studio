    <ellipse cx="-150" cy="80" rx="32" ry="22" fill="url(#cheek)"/>
    <ellipse cx="150" cy="80" rx="32" ry="22" fill="url(#cheek)"/>

    <path d="M -40 110 Q 0 130 40 110" stroke="#3a2e1f" stroke-width="4" fill="none"/>
  </g>

  <g transform="translate(170 380) rotate(20)">
