  </g>

  <rect x="80" y="500" width="640" height="40" fill="url(#desk)"/>
  <rect x="100" y="540" width="14" height="160" fill="#7d5d36"/>
  <rect x="686" y="540" width="14" height="160" fill="#7d5d36"/>

  <g transform="translate(400 540)">
