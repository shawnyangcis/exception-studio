<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff7e6"/>
      <stop offset="1" stop-color="#e9d9b8"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff2c8"/>
      <stop offset="1" stop-color="#f7d68a"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbf6e8"/>
      <stop offset="1" stop-color="#ead8b5"/>
    </linearGradient>
    <linearGradient id="desk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c79a6b"/>
      <stop offset="1" stop-color="#a06b3d"/>
    </linearGradient>
    <radialGradient id="cheek" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f4a5b6" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#f4a5b6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="window" cx="0.5" cy="0.5" r="0.7">
      <stop offset="0" stop-color="#a8d5e8" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#a8d5e8" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="800" fill="url(#bg)"/>

  <ellipse cx="160" cy="220" rx="220" ry="200" fill="url(#window)" opacity="0.6"/>
  <circle cx="540" cy="160" r="60" fill="url(#sun)" opacity="0.85"/>

